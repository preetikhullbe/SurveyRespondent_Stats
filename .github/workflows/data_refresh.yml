name: Daily Data Refresh

on:
  schedule:
    - cron: '0 13 * * *'  # 6:30 PM IST
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install pandas fastparquet elasticsearch streamlit pyarrow

      - name: Load data from Elasticsearch and save parquet chunks
        env:
          ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        run: python data_loader.py

      - name: Commit and push updated parquet files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_chunks/*.parquet
          git commit -m "Auto update Elasticsearch data"
          git push
