name: Daily Data Refresh

on:
  schedule:
    - cron: '30 19 * * *'  # ⏰ 1:00 AM IST (which is 7:30 PM UTC)
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pyodbc fastparquet elasticsearch==8.7.0

      - name: Run Data Loader
        env:
          ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        run: python data_loader.py

      - name: Commit and Push Data Chunks
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data_chunks/*.parquet
          git commit -m "🔄 Auto-update parquet chunks [$(date '+%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
          git push origin main
