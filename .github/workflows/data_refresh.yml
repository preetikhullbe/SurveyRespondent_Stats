name: Daily Data Refresh

on:
  schedule:
    - cron: '50 13 * * *'  # Runs every day at 8 AM UTC
  workflow_dispatch:      # Allows manual run

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install pandas pyodbc fastparquet

    - name: Remove old parquet parts
      run: |
        rm -f clientandsupplier1_part*.parquet

    - name: Load data and save parquet (split)
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
      run: python data_loader.py

    - name: Commit and push updated parquet parts
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add clientandsupplier1_part*.parquet
        git commit -m "♻️ Auto-update split parquet data"
        git push
