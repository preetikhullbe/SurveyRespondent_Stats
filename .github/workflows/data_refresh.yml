name: Daily Data Refresh

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pyodbc fastparquet elasticsearch==8.7.0

      - name: Run Data Loader
        env:
          ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        run: python data_loader.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data_chunks/*.parquet
          git commit -m "🔄 Auto-update parquet chunks [$(date '+%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git push
        env:
          # Needed for GitHub token to push changes
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Env Vars
        run: |
          echo "Cloud ID length: ${#ES_CLOUD_ID}"
          echo "Username length: ${#ES_USERNAME}"
        env:
          ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
